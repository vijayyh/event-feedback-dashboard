# Inventory: the servers that run the Event Feedback Dashboard.
# efd-node-1 is a clean Ubuntu 24.04 node created by provision.yml; its SSH port 22 is published on 2222
# and the application port 8095 on 8095 of the machine that runs Docker.
all:
  children:
    efd_servers:
      hosts:
        efd-node-1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/efd_node_ed25519
