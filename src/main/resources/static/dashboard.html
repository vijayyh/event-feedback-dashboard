<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · Event Feedback Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="index.html">Event <span>Feedback</span> Dashboard</a>
        <nav class="nav" id="nav"></nav>
        <div class="top-actions" id="topActions"></div>
    </div>
</header>

<main>
    <h1>Dashboard</h1>
    <p class="subtitle">Live indicators across all events. <span class="muted" id="updated"></span></p>

    <section class="kpis" id="kpis" aria-label="Summary indicators"></section>

    <div class="grid grid-2" style="margin-top:16px">
        <section class="card">
            <h2>Events by status</h2>
            <div id="eventBreakdown" class="breakdown"></div>
            <div id="drilldown" hidden style="margin-top:14px">
                <h3 id="drilldownTitle" style="margin:0 0 8px;font-size:1rem"></h3>
                <ul class="feedback-list" id="drilldownList"></ul>
            </div>
        </section>
        <section class="card">
            <h2>Feedback follow-up</h2>
            <div id="feedbackBreakdown" class="breakdown"></div>
            <p class="hint" style="margin-top:10px">Click a status to list that feedback below.</p>
        </section>
    </div>

    <section class="card" style="margin-top:16px">
        <h2>Search feedback</h2>
        <div id="searchNotice" hidden></div>
        <form class="toolbar" id="searchForm" role="search">
            <input type="search" name="q" placeholder="Keyword in comment or name…" aria-label="Keyword">
            <select name="eventId" id="eventFilter" aria-label="Event"><option value="">All events</option></select>
            <select name="status" id="statusFilter" aria-label="Follow-up status">
                <option value="">Any status</option>
                <option value="NEW">New</option>
                <option value="REVIEWED">Reviewed</option>
                <option value="ACTION_REQUIRED">Action required</option>
                <option value="RESOLVED">Resolved</option>
            </select>
            <select name="rating" aria-label="Rating">
                <option value="">Any rating</option>
                <option value="low">Low (1–2)</option>
                <option value="mid">Neutral (3)</option>
                <option value="high">High (4–5)</option>
            </select>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Submitted</th><th>Event</th><th>Rating</th><th>Comment</th><th>Follow-up</th></tr>
                </thead>
                <tbody id="feedbackRows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
            </table>
        </div>
    </section>
</main>

<footer>Event Feedback Dashboard · DevOps course project</footer>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
