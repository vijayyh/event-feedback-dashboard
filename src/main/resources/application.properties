spring.application.name=event-feedback-dashboard

# Embedded server port for local development (Jenkins uses 8080, Tomcat 11 uses 8081).
# Ignored when the WAR is deployed to an external Tomcat.
server.port=8090

# Monitoring endpoints used by smoke tests and operations
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jackson.serialization.write-dates-as-timestamps=false

# H2 file database kept outside the project folder so it survives restarts and is never committed
app.data-dir=${user.home}/.event-feedback-dashboard
spring.datasource.url=jdbc:h2:file:${app.data-dir}/efd-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Insert sample events and feedback on first start (empty database only)
app.seed-demo-data=true

# Organiser sign-in (attendees do not sign in). The password is never stored in Git:
#  - local development: application-local.properties next to pom.xml (git-ignored, see the .example file);
#    `mvn spring-boot:run` activates the 'local' profile, which loads that file
#  - servers / Jenkins:  environment variable SPRING_SECURITY_USER_PASSWORD
# If neither is set, Spring Boot prints a random password in the log at startup.
spring.security.user.name=organiser
spring.security.user.roles=ORGANISER

# Automatic alert rules (T09)
app.alerts.low-rating-max=2
app.alerts.low-average-threshold=3.0
app.alerts.low-average-min-responses=5
app.alerts.negative-keywords=worst,waste,boring,not audible,rude,poor,terrible,useless,disappointed,crowded,too long,too fast,slow
app.alerts.backfill-on-startup=true
