# Settings for every Event Feedback Dashboard server (the full specification is in docs/13).

# Environment name the application reports (/api/info and the page footer)
efd_environment: node

# HTTP port of the application
efd_port: 8095

# JVM options: small heap, exit on out-of-memory so systemd restarts the service
efd_java_opts: "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"

# Organiser password: read from the environment of the control node, never stored in Git
efd_organiser_password: "{{ lookup('ansible.builtin.env', 'EFD_ORGANISER_PASSWORD') }}"

# Release to deploy: the WAR that Jenkins built, tested and archived in build <efd_release_build> of EFD-Pipeline
efd_jenkins_archive: /mnt/c/ProgramData/Jenkins/.jenkins/jobs/EFD-Pipeline/builds
efd_release_build: 13
