<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events · Event Feedback Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="index.html">Event <span>Feedback</span> Dashboard</a>
        <nav class="nav" id="nav"></nav>
        <div class="top-actions" id="topActions"></div>
    </div>
</header>

<main>
    <h1>Events</h1>
    <p class="subtitle">See how every event was rated, read what attendees said, and share your own feedback.</p>

    <div class="toolbar">
        <input type="search" id="search" placeholder="Search events by name, venue or organiser…"
               aria-label="Search events">
        <select id="category" aria-label="Filter by category">
            <option value="">All categories</option>
            <option value="WORKSHOP">Workshop</option>
            <option value="SEMINAR">Seminar</option>
            <option value="WEBINAR">Webinar</option>
            <option value="HACKATHON">Hackathon</option>
            <option value="CULTURAL">Cultural</option>
            <option value="SPORTS">Sports</option>
            <option value="OTHER">Other</option>
        </select>
    </div>
    <div class="tabs" id="statusTabs" role="group" aria-label="Filter events by status"></div>
    <div class="grid grid-3" id="eventCards">
        <p class="empty">Loading events…</p>
    </div>
</main>

<footer>Event Feedback Dashboard · DevOps course project</footer>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
