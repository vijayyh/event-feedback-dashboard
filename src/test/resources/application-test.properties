# Tests use a throw-away in-memory database and no demo data
spring.datasource.url=jdbc:h2:mem:efd-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-demo-data=false

# Test-only organiser password (in-memory user for the security tests)
spring.security.user.password=test-only-password
